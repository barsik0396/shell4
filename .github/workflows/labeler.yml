name: 'Labeler'

on:
    pull_request:
        types: [opened, reopened, synchronize]
    workflow_dispatch:

jobs:
    labeler:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/labeler@v7.0.0
              with:
                   configuration-path: .github/labeler.yml