name: 'Lint'

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.0.0
            - name: Run linter
              uses: astral-sh/ruff-action@v4.1.0