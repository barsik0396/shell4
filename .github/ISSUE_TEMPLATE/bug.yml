name: 'Bug Report'
description: 'Report bug in shell4'
title: "Bug: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Steps to reproduce the behavior. Please provide a minimal reproducible example."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: "Actual behavior"
      description: "A clear and concise description of what actually happened."
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "I have searched the existing issues and believe this is a new bug."
          required: true
        - label: "I used the latest version of shell4."
          required: true