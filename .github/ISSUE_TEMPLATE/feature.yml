name: 'Feature Request'
description: 'Request a new feature for shell4'
title: "Feature Request: "
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: "Describe the feature"
      description: "A clear and concise description of the feature you would like to request."
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: "Use case"
      description: "Explain how this feature would be used and why it is important."
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "I have searched the existing issues and believe this is a new feature request."
          required: true