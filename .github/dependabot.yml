version: 2
updates:
  - package-ecosystem: pip
    schedule:
      interval: daily
      time: "19:36"
      timezone: "Europe/Riga"
    directory: "."
    labels:
      - dependencies
      - pip-deps
    open-pull-requests-limit: 10
    target-branch: main
    pull-request-branch-name:
      separator: /
      prefix: "deps"
  - package-ecosystem: github-actions
    schedule:
      interval: daily
      time: "20:00"
      timezone: "Europe/Riga"
    directory: "."
    labels:
      - dependencies
      - gh-deps
    open-pull-requests-limit: 10
    target-branch: main
    pull-request-branch-name:
      separator: /
      prefix: "deps"